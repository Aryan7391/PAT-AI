<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAT_7</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="sidebar-top">
            <button id="new-chat-btn">+ New Chat</button>
        </div>

        <div id="chat-list" class="chat-list"></div>

    </aside>


    <!-- Main -->
    <main class="main">

        <div id="messages" class="messages"></div>


        <!-- Input -->
        <div class="input-area">

            <textarea
                id="message-input"
                placeholder="Message PAT_7..."
            ></textarea>

            <button id="send-btn">Send</button>
            <button id="mic-btn" title="Click to record voice">🎤</button>

        </div>

        <div id="voice-bar" style="display:none;text-align:center;padding:6px;color:#f44336;font-size:13px;">🔴 Recording... click mic to stop</div>
    </main>

</div>

<script src="/static/app.js"></script>

</body>
</html>
